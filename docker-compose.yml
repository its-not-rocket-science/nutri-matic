services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nutrimatic
      POSTGRES_PASSWORD: nutrimatic
      POSTGRES_DB: nutrimatic
    ports:
      # host port 5433, not 5432 — avoids clashing with a locally-installed Postgres.
      # Only matters for host-side tools (e.g. ingest_fdc.py); the backend container
      # talks to this over the docker network on the default 5432.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nutrimatic"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Operational-hardening prompt 2: shared/durable store for the demo-
  # endpoint rate limiter (see backend/app/redis_rate_limit.py). Included
  # in the default local dev/test compose file so `docker compose up`
  # gives a faithful environment out of the box — same reasoning as
  # postgres above, not a separate opt-in setup step. Rate-limit data is
  # inherently ephemeral (every key carries its own short TTL — see
  # redis_rate_limit.py), so no volume/persistence is configured; a
  # restart just means every counter starts fresh, same as the
  # in-process fallback already did.
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://nutrimatic:nutrimatic@postgres:5432/nutrimatic
      # Dev-only value so `docker compose up` doesn't silently fall back to
      # app/auth.py's hardcoded "dev-secret-change-me" default (anyone who's
      # read the source — i.e. everyone, it's public — could otherwise forge
      # auth tokens for any user id). A real deployment MUST override this
      # with its own secret (e.g. via an untracked .env file / host secret
      # manager), never reuse the value below outside local development.
      JWT_SECRET: "1596dfe31d13c3682f357d84658459591506c44c91bb23eb8e063d12087e4799"
      CORS_ORIGINS: ${CORS_ORIGINS}
      REDIS_URL: redis://redis:6379/0
      # Operational-hardening prompt 4, requirement 2: "wire backend and
      # frontend events to the same release identifier/commit SHA".
      # ${RELEASE_VERSION:-} — same interpolation-from-the-invoking-
      # shell's-environment pattern CORS_ORIGINS above already relies on;
      # deploy.yml's deploy job exports RELEASE_VERSION=<the exact
      # rehearsed/deployed commit SHA> in the same SSH session that runs
      # `docker compose up -d backend`, so this picks it up automatically
      # on every real deploy. Empty locally/in CI (harmless — app/
      # monitoring.py's release= is already optional).
      RELEASE_VERSION: ${RELEASE_VERSION:-}
      # Prompt-5 validation finding: production runs behind a reverse
      # proxy (confirmed live via the `Via: 1.1 Caddy` response header on
      # api.nutri-matic.uk) but nothing here ever set this, so it was
      # silently defaulting to 0 ("trust nothing") — every request was
      # reaching the app as Caddy's own address, collapsing the per-IP
      # demo-creation limit into a second global-only one (see
      # demo_protection.py's own docstring for what this value means).
      # Same shell-interpolation pattern as CORS_ORIGINS/RELEASE_VERSION
      # above — set TRUSTED_PROXY_HOP_COUNT in the server's own env
      # (e.g. its .env file next to this compose file) to the number of
      # proxy hops actually in front of the app; see DEPLOYMENT.md and
      # docs/rate-limiting.md.
      TRUSTED_PROXY_HOP_COUNT: ${TRUSTED_PROXY_HOP_COUNT:-0}
      # prompts.txt PROMPT 10: which app.source_licence_policy surfaces
      # THIS deployment is actually provisioned to serve -- consulted by
      # app.import_reviewed_phytate_mappings' --apply (via
      # check_deployment_permits_write) as a second, deployment-bound
      # safeguard independent of whatever an operator types on the
      # command line. Fixed, not shell-interpolated with a `${VAR:-}`
      # empty default like CORS_ORIGINS/TRUSTED_PROXY_HOP_COUNT above --
      # this isn't a deployment-specific secret or topology fact, it's a
      # stable architectural fact about this app: nutri-matic only ever
      # runs as the ordinary personal free product (see Prompt 4/7's
      # plan-parity requirement, and prompts.txt's own point that a
      # Professional dashboard, Enterprise/batch tool, and paid-export
      # service don't exist as separate deployments of this codebase at
      # all). A bot-review finding on PR #58 caught that this was never
      # wired in here, meaning `--apply` would always fail closed for
      # every surface, including the ones this deployment genuinely does
      # serve -- an unset env var here isn't a safe residual default,
      # it's a broken one, so the fix is to declare the truth once, not
      # to relax the check.
      DEPLOYMENT_PERMITTED_SURFACES: "personal_free_ui,personal_free_internal_api"
      # PROMPT 13: the shared secret gating GET /api/ready/licence-policy-
      # coverage (app/routers/health.py's require_ops_diagnostic_token).
      # Empty-default shell interpolation, same as CORS_ORIGINS/
      # RELEASE_VERSION/TRUSTED_PROXY_HOP_COUNT above -- unlike those,
      # though, an unset value here is the SAFE default (the endpoint
      # fails every request closed with no token configured, never
      # "unprotected"), so there's no equivalent of DEPLOYMENT_PERMITTED_
      # SURFACES' "unset is a broken default" problem. Set via the
      # server's own .env file / host secret manager when an operator
      # actually wants this diagnostic reachable.
      OPS_DIAGNOSTIC_TOKEN: ${OPS_DIAGNOSTIC_TOKEN:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:

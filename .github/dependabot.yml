# Weekly dependency updates, one grouped PR per ecosystem (plus one grouped
# PR per ecosystem for security updates). No auto-merge: every PR is
# reviewed and merged by hand, and must pass the required CI checks.
#
# The workflow actions are pinned to full commit SHAs with the version as a
# trailing comment (`@<sha>  # v4.4.0`); Dependabot updates both together.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies]
    groups:
      github-actions:
        applies-to: version-updates
        patterns: ["*"]
      github-actions-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    labels: [dependencies]
    groups:
      pip:
        applies-to: version-updates
        patterns: ["*"]
      pip-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    labels: [dependencies]
    groups:
      npm:
        applies-to: version-updates
        patterns: ["*"]
      npm-security:
        applies-to: security-updates
        patterns: ["*"]

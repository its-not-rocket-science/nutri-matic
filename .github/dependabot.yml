# Weekly dependency updates, one grouped PR per ecosystem (plus one grouped
# PR per ecosystem for security updates). No auto-merge: every PR is
# reviewed and merged by hand, and must pass the required CI checks.
#
# The workflow actions are pinned to full commit SHAs with the version as a
# trailing comment (`@<sha>  # v4.4.0`); Dependabot updates both together.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies]
    groups:
      github-actions:
        applies-to: version-updates
        patterns: ["*"]
      github-actions-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    labels: [dependencies]
    # SQLAlchemy 2.1 changes the default driver for postgresql:// URLs from
    # psycopg2 to psycopg 3, which breaks this project: psycopg2-binary is
    # installed, and PR #78 failed with "No module named 'psycopg'". Moving
    # to 2.1 needs a deliberate migration of every DATABASE_URL.
    ignore:
      - dependency-name: "sqlalchemy"
        versions: [">=2.1"]
    groups:
      pip:
        applies-to: version-updates
        patterns: ["*"]
      pip-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    labels: [dependencies]
    # Major bumps of the SvelteKit/Vite/Sentry stack need a manual
    # migration, so Dependabot never proposes them.
    ignore:
      - dependency-name: "@sveltejs/kit"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@sveltejs/adapter-vercel"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@sveltejs/vite-plugin-svelte"
        update-types: ["version-update:semver-major"]
      - dependency-name: "svelte"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@sentry/sveltekit"
        update-types: ["version-update:semver-major"]
    groups:
      # Listed before "npm" so these packages land here (first match wins).
      svelte-stack:
        applies-to: version-updates
        patterns:
          - "@sveltejs/kit"
          - "@sveltejs/adapter-vercel"
          - "@sveltejs/vite-plugin-svelte"
          - "svelte"
          - "vite"
          - "@sentry/sveltekit"
        update-types: [minor, patch]
      npm:
        applies-to: version-updates
        patterns: ["*"]
      npm-security:
        applies-to: security-updates
        patterns: ["*"]

# Production-hardening prompt 5. Runs backend tests (unit, API, security-
# regression, and the real Alembic migration chain — all one pytest
# suite, see the comment on that step below), frontend unit tests, type
# checking, and both production builds, on every push to main and every
# PR.
#
# "Require successful checks before merge" (this prompt's other explicit
# requirement) is a GitHub branch-protection setting, not something a
# workflow file can express on its own — it has to be turned on once via
# the repo's Settings -> Branches -> Branch protection rules for `main`,
# selecting the `backend` and `frontend` jobs below as required status
# checks. Not done here: changing branch protection is a repo-admin
# action outside what a workflow-file change can or should do
# unilaterally — see docs/production-hardening.md's prompt 5 section for
# the exact manual step and why it's left to the repo owner.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nutrimatic
          POSTGRES_PASSWORD: nutrimatic
          POSTGRES_DB: nutrimatic
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nutrimatic"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      # Operational-hardening prompt 2: gives test_redis_rate_limit.py a
      # real Redis to run against, same "skip locally if unreachable,
      # must run for real in CI" convention as the postgres-only tests
      # (test_verify_pre_alembic_schema.py etc.) already use.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://nutrimatic:nutrimatic@localhost:5432/nutrimatic
      JWT_SECRET: ci-test-secret-not-for-production-use
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Verify Postgres role has CREATEDB (required for migration tests)
        # Belt-and-suspenders: tests/test_migrations.py self-skips (rather
        # than fails) when the connecting role can't CREATEDB, which is
        # correct for a restricted local-dev role but must never happen
        # silently in CI — a skip here would defeat prompt 1's explicit
        # acceptance criterion "backend migration tests execute rather
        # than skip". This step fails the job loudly, before tests even
        # run, if the CI Postgres service is ever reconfigured to a role
        # without it.
        run: |
          pip install psycopg2-binary --quiet
          python -c "
          import psycopg2
          conn = psycopg2.connect('postgresql://nutrimatic:nutrimatic@localhost:5432/postgres')
          cur = conn.cursor()
          cur.execute(\"SELECT rolcreatedb OR rolsuper FROM pg_roles WHERE rolname = current_user\")
          ok = bool(cur.fetchone()[0])
          assert ok, 'CI Postgres role lacks CREATEDB — migration tests would silently skip instead of running'
          print('CREATEDB privilege confirmed for migration tests')
          "
      - name: Phytate review consistency + canonical mapping regeneration (fail on drift)
        # prompts.txt PROMPT 8: docs/phytate-review/final_approved_mapping.csv
        # is a generated artifact (export_final_mapping.py, from the seven
        # signed review_*.csv files), not hand-edited — if regenerating it
        # here produces anything different from what's committed, either a
        # review file was edited without regenerating the mapping, or the
        # generation script itself changed behaviour. Either way that must
        # fail the build, not silently drift. check_consistency.py runs
        # first since export_final_mapping.py's own validation only covers
        # a subset of what it checks (see that script's module docstring).
        working-directory: docs/phytate-review
        run: |
          python check_consistency.py --dir .
          python export_final_mapping.py
          git diff --exit-code -- final_approved_mapping.csv
      - name: Confirm no licensed source workbook is tracked in git
        # prompts.txt PROMPT 8: the real PhyFoodComp_1.0.xlsx must never
        # enter this repository (see ingest_phytate.py's module docstring)
        # — checked directly against git's own tracked-file list, not the
        # working tree, so a build artifact or local scratch file can't
        # produce a false failure.
        run: |
          if git ls-files | grep -iE '\.xlsx$'; then
            echo "A tracked .xlsx file was found — the licensed PhyFoodComp workbook must never be committed."
            exit 1
          fi
          echo "No .xlsx files tracked in git."
      - name: Run backend tests (unit, API, security-regression, migrations)
        working-directory: backend
        # A single suite: tests/test_hardening_regression_suite.py and
        # every test_recommendations_*/test_recipe_access.py file *are*
        # the security-regression coverage (see that file's own module
        # docstring); tests/test_migrations.py exercises the real Alembic
        # chain against this job's own Postgres service, which grants its
        # user CREATEDB by default, so those tests run for real here
        # rather than self-skipping the way they do against a locally
        # restricted role — see docs/migrations.md.
        #
        # `python -m pytest`, not a bare `pytest` — this is not
        # stylistic. A bare `pytest` invocation does not add the current
        # working directory to sys.path, so `from app...` inside every
        # test file fails with "No module named 'app'"; `python -m
        # pytest` does add it, same as every local run of this suite
        # this whole project has ever used. This was a real, pre-existing
        # bug — CI's backend job has been failing at collection on every
        # run, going back before this hardening round — found by
        # operational-hardening prompt 1's "trigger a real run and record
        # results" requirement actually being followed through on, not
        # inferred from reading the YAML.
        run: python -m pytest -q
      - name: Dependency vulnerability scan (informational)
        working-directory: backend
        # Non-blocking: reports known CVEs in dependencies without failing
        # the build. A blocking scan would need a documented process for
        # handling findings with no available non-breaking fix (see
        # docs/production-readiness-audit.md) — not set up yet, so this
        # stays informational rather than red-herring-failing CI on
        # something no one has a safe fix for.
        run: pip install pip-audit && pip-audit -r requirements.txt || true

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Type-check
        working-directory: frontend
        run: npm run check
      - name: Unit tests
        working-directory: frontend
        run: npm run test
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: Dependency vulnerability scan (informational)
        working-directory: frontend
        run: npm audit --audit-level=high || true

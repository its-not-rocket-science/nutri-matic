# Production-hardening prompt 5. Runs backend tests (unit, API, security-
# regression, and the real Alembic migration chain — all one pytest
# suite, see the comment on that step below), frontend unit tests, type
# checking, and both production builds, on every push to main and every
# PR.
#
# "Require successful checks before merge" (this prompt's other explicit
# requirement) is a GitHub branch-protection setting, not something a
# workflow file can express on its own — it has to be turned on once via
# the repo's Settings -> Branches -> Branch protection rules for `main`,
# selecting the `backend` and `frontend` jobs below as required status
# checks. Not done here: changing branch protection is a repo-admin
# action outside what a workflow-file change can or should do
# unilaterally — see docs/production-hardening.md's prompt 5 section for
# the exact manual step and why it's left to the repo owner.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nutrimatic
          POSTGRES_PASSWORD: nutrimatic
          POSTGRES_DB: nutrimatic
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nutrimatic"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://nutrimatic:nutrimatic@localhost:5432/nutrimatic
      JWT_SECRET: ci-test-secret-not-for-production-use
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Run backend tests (unit, API, security-regression, migrations)
        working-directory: backend
        # A single suite: tests/test_hardening_regression_suite.py and
        # every test_recommendations_*/test_recipe_access.py file *are*
        # the security-regression coverage (see that file's own module
        # docstring); tests/test_migrations.py exercises the real Alembic
        # chain against this job's own Postgres service, which grants its
        # user CREATEDB by default, so those tests run for real here
        # rather than self-skipping the way they do against a locally
        # restricted role — see docs/migrations.md.
        run: pytest -q
      - name: Dependency vulnerability scan (informational)
        working-directory: backend
        # Non-blocking: reports known CVEs in dependencies without failing
        # the build. A blocking scan would need a documented process for
        # handling findings with no available non-breaking fix (see
        # docs/production-readiness-audit.md) — not set up yet, so this
        # stays informational rather than red-herring-failing CI on
        # something no one has a safe fix for.
        run: pip install pip-audit && pip-audit -r requirements.txt || true

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Type-check
        working-directory: frontend
        run: npm run check
      - name: Unit tests
        working-directory: frontend
        run: npm run test
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: Dependency vulnerability scan (informational)
        working-directory: frontend
        run: npm audit --audit-level=high || true

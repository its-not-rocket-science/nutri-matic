# Operational-hardening prompt 4, requirement 7: "uptime checks" —
# achievable entirely from this repository, without needing external
# SaaS credentials (UptimeRobot/Pingdom/etc. all require an account this
# session has no way to create or verify). Runs the same read-only
# app/smoke_check.py a human already runs manually post-deploy (see
# docs/monitoring.md), on a schedule instead, against the public
# frontend/backend URLs only — no --include-demo-flow, no DATABASE_URL:
# production Postgres isn't reachable from a public runner anyway (see
# demo-purge.yml's own note on this), and an uptime check has no reason
# to write anything.
#
# A failed run shows as a red X on this workflow and (depending on each
# watcher's own GitHub notification settings) an email/notification —
# this is a genuine, always-on signal, but it is NOT the same as a
# paged on-call alert with a named owner; see docs/monitoring.md's own
# "alert ownership: not assigned" caveat, which still applies here.
name: Uptime check

on:
  schedule:
    - cron: "*/15 * * * *" # every 15 minutes
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: uptime-check
  cancel-in-progress: true

jobs:
  smoke-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run read-only smoke check against production
        working-directory: backend
        run: |
          python -m app.smoke_check \
            --backend-url https://api.nutri-matic.uk \
            --frontend-url https://nutri-matic.uk

      # One open issue per outage instead of an email every 15 minutes.
      # GitHub emails you when the issue is opened; later failures only add
      # a comment. Recovery comments and closes it.
      - name: Open or update an outage issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing=$(gh issue list --label uptime-outage --state open --json number --jq '.[0].number // empty')
          body="Uptime check failed: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [ -z "$existing" ]; then
            gh label create uptime-outage --color B60205 --description "Production uptime check failing" 2>/dev/null || true
            gh issue create --title "Production is down: uptime check failing" --label uptime-outage --body "$body"
          else
            gh issue comment "$existing" --body "$body"
          fi

      - name: Close the outage issue on recovery
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for n in $(gh issue list --label uptime-outage --state open --json number --jq '.[].number'); do
            gh issue close "$n" --comment "Recovered: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          done

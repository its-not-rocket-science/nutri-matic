name: Rehearse and Deploy Backend

# Trigger: after your existing test/CI workflow succeeds on main.
# Adjust `workflow_run` to match whatever your current CI workflow is named,
# or switch to `push: branches: [main]` if this should run standalone.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  # Manual runs: force a rehearsal + deploy of main's HEAD, or of an older
  # commit on main (a deliberate rollback). See DEPLOYMENT.md, "Deploy
  # ordering and rollbacks".
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit to deploy (40-hex, must be on main). Empty = HEAD of the ref this runs on."
        required: false
        default: ""
        type: string
      allow_rollback:
        description: "Allow deploying a commit older than the one currently deployed (deliberate rollback)."
        required: false
        default: false
        type: boolean

jobs:
  # Decide whether this run needs a backend deploy at all. A merge that only
  # touches the frontend (deployed separately by Vercel) or docs must not run
  # the rehearsal or queue a production approval. workflow_dispatch always
  # deploys, so it doubles as the "force a deploy" path.
  #
  # The diff base is the `deployed-prod` tag, which the deploy job moves to
  # the deployed SHA only after a successful deploy + smoke test. Diffing
  # against the last good deploy (not head_sha~1) means backend changes are
  # still caught after a multi-commit push, a cancelled CI run, or a
  # rejected production approval. When in doubt (tag missing, diff fails)
  # this fails open to needed=true; the production approval gate still
  # applies.
  changes:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    outputs:
      needed: ${{ steps.decide.outputs.needed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: ${{ github.event_name == 'workflow_run' }}
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Decide whether a backend deploy is needed
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "$EVENT_NAME" != "workflow_run" ]; then
            echo "Manual run ($EVENT_NAME): backend deploy always needed."
            echo "needed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! base=$(git rev-parse -q --verify "refs/tags/deployed-prod^{commit}"); then
            echo "::warning::Tag deployed-prod not found; assuming a backend deploy is needed."
            echo "needed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git merge-base --is-ancestor "$base" "$HEAD_SHA"; then
            # e.g. the last deploy was a workflow_dispatch from another ref.
            # A two-tree diff still compares what is live with what would
            # ship; if even that fails, the check below fails open.
            echo "::warning::deployed-prod ($base) is not an ancestor of $HEAD_SHA; comparing trees directly."
          fi
          if ! changed=$(git diff --name-only "$base" "$HEAD_SHA"); then
            echo "::warning::Could not diff deployed-prod ($base)..$HEAD_SHA; assuming a backend deploy is needed."
            echo "needed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Changed paths since last deploy, deployed-prod ($base)..$HEAD_SHA:"
          printf '%s\n' "$changed" | sed 's/^/  /'
          if printf '%s\n' "$changed" | grep -Eq '^(backend/|deploy/|docker-compose\.yml$|\.github/workflows/deploy\.yml$)|(^|/)Dockerfile[^/]*$'; then
            echo "Backend-relevant change found: deploy needed."
            echo "needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No backend-relevant change: rehearsal and deploy will be skipped."
            echo "needed=false" >> "$GITHUB_OUTPUT"
          fi

  rehearse-migration:
    needs: changes
    if: ${{ needs.changes.outputs.needed == 'true' }}
    runs-on: ubuntu-24.04
    outputs:
      deploy_sha: ${{ steps.pin-sha.outputs.sha }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: rehearsal
          POSTGRES_DB: rehearsal
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      # Pin the exact commit this run rehearses, so the deploy job later
      # deploys THIS commit specifically — not whatever `main` has moved to
      # by the time a human approves the deploy step.
      - name: Determine commit to rehearse and deploy
        id: pin-sha
        env:
          EVENT_NAME: ${{ github.event_name }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT_SHA: ${{ inputs.sha }}
          REF_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            sha="$RUN_HEAD_SHA"
          elif [ -n "$INPUT_SHA" ]; then
            sha="$INPUT_SHA"
          else
            sha="$REF_SHA"
          fi
          if ! printf '%s' "$sha" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::Commit to deploy must be a full 40-character lowercase hex SHA"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ steps.pin-sha.outputs.sha }}

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      # Secrets used here (add under Settings > Secrets and variables > Actions,
      # scoped to this repo — NOT stored in this file):
      #   PROD_SSH_KEY   — private key for a deploy-only user on the server,
      #                    ideally restricted (see notes below) to running the
      #                    pg_dump command and nothing else.
      #   PROD_SSH_HOST  — e.g. root@138.199.160.26 (or a dedicated non-root user)
      - name: Fetch a fresh production dump over SSH
        env:
          SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new "$SSH_HOST" \
            "cd nutri-matic && docker compose exec -T postgres pg_dump -U nutrimatic -Fc nutrimatic" \
            > rehearsal.dump

      - name: Restore into the rehearsal database
        run: |
          # Run pg_restore from the same Postgres major version as the server and the
          # rehearsal service (16), so a newer client on the runner image can't break it.
          docker run --rm --network host -v "$PWD:/work" -e PGPASSWORD=rehearsal postgres:16-alpine \
            pg_restore -h localhost -p 5432 -U postgres -d rehearsal --clean --if-exists --no-owner --no-privileges /work/rehearsal.dump

      - name: Verify schema before migrating
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:rehearsal@localhost:5432/rehearsal
        run: python -m app.verify_pre_alembic_schema

      - name: Run alembic upgrade head
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:rehearsal@localhost:5432/rehearsal
        run: |
          python -m alembic current
          python -m alembic upgrade head
          python -m alembic current

      - name: Confirm zero schema drift after migrating
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:rehearsal@localhost:5432/rehearsal
        run: python check_schema_drift.py

      - name: Rehearse downgrade and re-upgrade
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:rehearsal@localhost:5432/rehearsal
        run: |
          python -m alembic downgrade -1
          python -m alembic upgrade head

      # Canonical foods plan Q6 (owner, 2026-11-28): grade the 34 golden
      # en-GB search queries against the migrated production copy. Read-only
      # (the report sets default_transaction_read_only on every connection),
      # and it prints only public FDC/canonical food names and timings, never
      # user data. NON-BLOCKING: a regression shows as a warning annotation
      # and a failed step, but continue-on-error keeps the job green, so it
      # never stops a deploy.
      - name: Golden search report on the production copy (non-blocking)
        continue-on-error: true
        timeout-minutes: 10
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:rehearsal@localhost:5432/rehearsal
        run: |
          status=0
          python -m app.search_golden_report --github > golden_report.out || status=$?
          # workflow-command lines (::warning) are for the log; the table is for the summary
          grep '^::' golden_report.out || true
          {
            echo "## Golden search report (production copy, after migrations)"
            echo
            grep -v '^::' golden_report.out
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit "$status"

  deploy:
    needs: [changes, rehearse-migration]
    if: ${{ needs.changes.outputs.needed == 'true' }}
    runs-on: ubuntu-24.04
    # Configure this environment under Settings > Environments > production
    # with "Required reviewers" set to yourself. The job will pause here and
    # wait for a manual approval click before proceeding — this is the human
    # gate that replaces you typing the deploy commands by hand.
    environment:
      name: production
    # One production deploy at a time, across all runs of this workflow. A
    # deploy that is already running is never cancelled.
    # GitHub keeps at most one more deploy job pending in the group; a newer
    # one replaces it, and the replaced run shows as cancelled.
    concurrency:
      group: prod-deploy
      cancel-in-progress: false
    # Only needed to move the deployed-prod tag after a successful deploy.
    permissions:
      contents: write
    env:
      DEPLOY_SHA: ${{ needs.rehearse-migration.outputs.deploy_sha }}
    steps:
      # Full history + tags: the ordering guard below needs both, and the
      # last step uses this checkout to move the tag.
      - name: Check out the commit being deployed
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ env.DEPLOY_SHA }}
          fetch-depth: 0
          fetch-tags: true

      # Refuse to move production backwards by accident, e.g. when an older
      # run's approval is clicked after a newer commit has already been
      # deployed. Runs after the approval, so it compares against the tag as
      # it is now, not as it was when the run started.
      - name: Refuse to deploy a commit older than the deployed one
        env:
          ALLOW_ROLLBACK: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_rollback }}
        run: |
          git fetch --force origin 'refs/tags/deployed-prod:refs/tags/deployed-prod' || true
          if ! deployed=$(git rev-parse -q --verify "refs/tags/deployed-prod^{commit}"); then
            echo "::warning::Tag deployed-prod not found; skipping the ordering check."
            exit 0
          fi
          if [ "$DEPLOY_SHA" != "$deployed" ] && git merge-base --is-ancestor "$DEPLOY_SHA" "$deployed"; then
            if [ "$ALLOW_ROLLBACK" = "true" ]; then
              echo "::warning::Deliberate rollback: deploying $DEPLOY_SHA, older than deployed-prod ($deployed)."
            else
              echo "::error::$DEPLOY_SHA is an older commit than what is deployed (deployed-prod = $deployed); not rolling back. To roll back on purpose, run this workflow by hand with sha=$DEPLOY_SHA and allow_rollback=true."
              exit 1
            fi
          else
            echo "OK: $DEPLOY_SHA is not older than deployed-prod ($deployed)."
          fi

      - name: Deploy the exact rehearsed commit via SSH
        env:
          SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # The server's forced-command wrapper (deploy/deploy-allowed-
          # commands.sh) accepts only `deploy <40-hex-sha>` and runs a fixed
          # fetch / checkout / build / up sequence itself. No shell text
          # from this workflow is ever evaluated on the server.
          if ! printf '%s' "$DEPLOY_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::DEPLOY_SHA is not a 40-character lowercase hex SHA"
            exit 1
          fi
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new "$SSH_HOST" "deploy $DEPLOY_SHA"

      - name: Verify migration reached head on the live server
        env:
          SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new "$SSH_HOST" \
            "cd nutri-matic && docker compose exec -T backend alembic current"

      - name: Smoke test
        run: |
          for endpoint in health ready; do
            for i in $(seq 1 12); do
              if curl -sf "https://api.nutri-matic.uk/api/$endpoint" > /dev/null; then
                echo "$endpoint OK (attempt $i)"
                break
              fi
              if [ "$i" = 12 ]; then
                echo "::error::$endpoint did not become healthy after 60s"
                exit 1
              fi
              echo "$endpoint not ready yet, attempt $i, retrying in 5s..."
              sleep 5
            done
          done

      # Mark this commit as the last good production deploy. The changes job
      # diffs future runs against this tag, so it must move only after the
      # deploy and smoke test above succeeded (any failure stops the job
      # before reaching here). A deliberate rollback (allow_rollback) moves
      # the tag back to the older SHA. Uses the checkout from the first step.
      - name: Move deployed-prod tag to the deployed commit
        run: |
          git tag -f deployed-prod "$DEPLOY_SHA"
          git push -f origin refs/tags/deployed-prod

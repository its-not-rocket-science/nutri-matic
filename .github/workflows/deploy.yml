name: Rehearse and Deploy Backend

# Trigger: after your existing test/CI workflow succeeds on main.
# Adjust `workflow_run` to match whatever your current CI workflow is named,
# or switch to `push: branches: [main]` if this should run standalone.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}   # allows manually re-running rehearsal/deploy on demand

jobs:
  rehearse-migration:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    outputs:
      deploy_sha: ${{ steps.pin-sha.outputs.sha }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: rehearsal
          POSTGRES_DB: rehearsal
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      # Pin the exact commit this run rehearses, so the deploy job later
      # deploys THIS commit specifically — not whatever `main` has moved to
      # by the time a human approves the deploy step.
      - name: Determine commit to rehearse and deploy
        id: pin-sha
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.pin-sha.outputs.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      # Secrets used here (add under Settings > Secrets and variables > Actions,
      # scoped to this repo — NOT stored in this file):
      #   PROD_SSH_KEY   — private key for a deploy-only user on the server,
      #                    ideally restricted (see notes below) to running the
      #                    pg_dump command and nothing else.
      #   PROD_SSH_HOST  — e.g. root@138.199.160.26 (or a dedicated non-root user)
      - name: Fetch a fresh production dump over SSH
        env:
          SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new "$SSH_HOST" \
            "cd nutri-matic && docker compose exec -T postgres pg_dump -U nutrimatic -Fc nutrimatic" \
            > rehearsal.dump

      - name: Restore into the rehearsal database
        run: |
          export PGPASSWORD=rehearsal
          pg_restore -h localhost -p 5432 -U postgres -d rehearsal --clean --if-exists --no-owner --no-privileges rehearsal.dump

      - name: Verify schema before migrating
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:rehearsal@localhost:5432/rehearsal
        run: python -m app.verify_pre_alembic_schema

      - name: Run alembic upgrade head
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:rehearsal@localhost:5432/rehearsal
        run: |
          python -m alembic current
          python -m alembic upgrade head
          python -m alembic current

      - name: Confirm zero schema drift after migrating
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:rehearsal@localhost:5432/rehearsal
        run: python check_schema_drift.py

      - name: Rehearse downgrade and re-upgrade
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:rehearsal@localhost:5432/rehearsal
        run: |
          python -m alembic downgrade -1
          python -m alembic upgrade head

  deploy:
    needs: rehearse-migration
    runs-on: ubuntu-latest
    # Configure this environment under Settings > Environments > production
    # with "Required reviewers" set to yourself. The job will pause here and
    # wait for a manual approval click before proceeding — this is the human
    # gate that replaces you typing the deploy commands by hand.
    environment:
      name: production
    env:
      DEPLOY_SHA: ${{ needs.rehearse-migration.outputs.deploy_sha }}
    steps:
      - name: Deploy the exact rehearsed commit via SSH
        env:
          SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new "$SSH_HOST" "
            set -e
            cd nutri-matic
            git fetch origin
            git checkout $DEPLOY_SHA
            echo 'Deploying commit: '\$(git rev-parse HEAD)
            export RELEASE_VERSION=$DEPLOY_SHA
            docker compose build backend
            docker compose up -d backend
          "

      - name: Verify migration reached head on the live server
        env:
          SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new "$SSH_HOST" \
            "cd nutri-matic && docker compose exec -T backend alembic current"

      - name: Smoke test
        run: |
          for endpoint in health ready; do
            for i in $(seq 1 12); do
              if curl -sf "https://api.nutri-matic.uk/api/$endpoint" > /dev/null; then
                echo "$endpoint OK (attempt $i)"
                break
              fi
              if [ "$i" = 12 ]; then
                echo "::error::$endpoint did not become healthy after 60s"
                exit 1
              fi
              echo "$endpoint not ready yet, attempt $i, retrying in 5s..."
              sleep 5
            done
          done

      # Operational-hardening prompt 4, requirement 9: "deploy
      # annotations/releases". Entirely optional and non-blocking —
      # SENTRY_AUTH_TOKEN/SENTRY_ORG/SENTRY_PROJECTS are not required
      # secrets; this step no-ops (echoes a skip message, exits 0) when
      # they're unset, same as every other optional-credential path this
      # repo already follows (demo-purge.yml, redis_rate_limit.py). Never
      # allowed to fail the deploy itself over a monitoring-annotation
      # problem — `|| echo` on the curl calls, not `set -e`. Creates a
      # Sentry release named after the exact deployed commit SHA (the
      # same value RELEASE_VERSION/PUBLIC_RELEASE_VERSION tag events
      # with — see app/monitoring.py/hooks.*.ts) and records a production
      # deploy against it, so Sentry's own UI can show "this error first
      # appeared in this release" and "these releases have been deployed
      # to production". UNVERIFIED against a real Sentry org — this
      # session has no SENTRY_AUTH_TOKEN to test against; see
      # docs/monitoring.md's manual checklist.
      - name: Record a Sentry release/deploy annotation (optional)
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECTS: ${{ secrets.SENTRY_PROJECTS }}
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ] || [ -z "$SENTRY_ORG" ] || [ -z "$SENTRY_PROJECTS" ]; then
            echo "SENTRY_AUTH_TOKEN/SENTRY_ORG/SENTRY_PROJECTS not fully configured — skipping release annotation (see docs/monitoring.md)."
            exit 0
          fi
          projects_json=$(printf '%s' "$SENTRY_PROJECTS" | tr ',' '\n' | sed 's/^ *//;s/ *$//' | jq -R . | jq -s .)
          curl -sf -X POST "https://sentry.io/api/0/organizations/$SENTRY_ORG/releases/" \
            -H "Authorization: Bearer $SENTRY_AUTH_TOKEN" -H "Content-Type: application/json" \
            -d "{\"version\": \"$DEPLOY_SHA\", \"projects\": $projects_json, \"refs\": [{\"repository\": \"its-not-rocket-science/nutri-matic\", \"commit\": \"$DEPLOY_SHA\"}]}" \
            || echo "::warning::Sentry release creation failed — deploy itself is unaffected, see docs/monitoring.md"
          curl -sf -X POST "https://sentry.io/api/0/organizations/$SENTRY_ORG/releases/$DEPLOY_SHA/deploys/" \
            -H "Authorization: Bearer $SENTRY_AUTH_TOKEN" -H "Content-Type: application/json" \
            -d '{"environment": "production"}' \
            || echo "::warning::Sentry deploy annotation failed — deploy itself is unaffected, see docs/monitoring.md"
